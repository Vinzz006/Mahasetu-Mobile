name: Security CI & Vulnerability Scan

on:
  push:
    branches: [ main, security/hardening ]
  pull_request:
    branches: [ main ]

jobs:
  typecheck-and-audit:
    name: TypeScript Check & Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck codebase
        run: npx tsc --noEmit

      - name: Audit dependencies for high/critical vulnerabilities
        run: |
          node -e '
          const { execSync } = require("child_process");
          let out;
          try {
            out = execSync("npm audit --json", { maxBuffer: 10 * 1024 * 1024 });
          } catch (err) {
            out = err.stdout || "";
          }
          const report = JSON.parse(out.toString());
          // Documented upstream build-time vulnerability exception:
          // image-size <=2.0.2 is a Metro 0.81 build-time dependency. Metro 0.81 cannot consume
          // image-size 2.x CommonJS exports; remediation requires a future React Native/Metro upgrade.
          const allowedAdvisories = new Set([
            "GHSA-w3rx-r6r6-pgpr",
            "GHSA-5p2g-fcmc-qvqq",
            "GHSA-5p6h-fcmc-qvqq"
          ]);

          function getRootAdvisories(pkgName, visited = new Set()) {
            if (visited.has(pkgName)) return [];
            visited.add(pkgName);
            const info = report.vulnerabilities && report.vulnerabilities[pkgName];
            if (!info || !info.via) return [];
            const advisories = [];
            for (const item of info.via) {
              if (typeof item === "object") {
                advisories.push(item);
              } else if (typeof item === "string") {
                advisories.push(...getRootAdvisories(item, visited));
              }
            }
            return advisories;
          }

          const violations = [];
          for (const [pkg, info] of Object.entries(report.vulnerabilities || {})) {
            if (info.severity === "critical") {
              violations.push({ package: pkg, severity: "critical", via: info.via });
              continue;
            }
            if (info.severity === "high") {
              const rootAdvisories = getRootAdvisories(pkg);
              if (rootAdvisories.length === 0) {
                violations.push({ package: pkg, severity: "high", reason: "Unresolved dependency path", via: info.via });
                continue;
              }
              for (const adv of rootAdvisories) {
                const advId = adv.url ? adv.url.split("/").pop() : "";
                const isAllowed = allowedAdvisories.has(advId);
                if (adv.severity === "critical" || (adv.severity === "high" && !isAllowed)) {
                  violations.push({ package: pkg, severity: adv.severity, title: adv.title, url: adv.url });
                }
              }
            }
          }

          if (violations.length > 0) {
            console.error("::error::Unapproved high or critical vulnerabilities detected:");
            console.error(JSON.stringify(violations, null, 2));
            process.exit(1);
          }
          console.log("Security audit passed: 0 unapproved high/critical vulnerabilities.");
          console.log("Documented build-tool exception acknowledged: image-size (Metro 0.81 build dependency).");
          '

  secret-scan:
    name: Secret & Credential Leak Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
