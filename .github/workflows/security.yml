name: Security CI & Vulnerability Scan

on:
  push:
    branches: [ main, security/hardening ]
  pull_request:
    branches: [ main ]

jobs:
  typecheck-and-audit:
    name: TypeScript Check & Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck codebase
        run: npx tsc --noEmit

      - name: Audit dependencies for high/critical vulnerabilities
        run: npm audit --audit-level=high

  secret-scan:
    name: Secret & Credential Leak Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
